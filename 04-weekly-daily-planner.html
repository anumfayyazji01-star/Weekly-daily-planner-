<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly & Daily Job Search Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#192338;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 16px}.tag{color:#3157d5;font-size:11px;font-weight:800;letter-spacing:.12em}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:32px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted,small{color:#68748a}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5dce8;border-radius:8px;font:inherit}textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3157d5;color:white;font-weight:700;cursor:pointer;margin:8px 6px 0 0}.alt{background:#eaf0ff;color:#3157d5}.out{white-space:pre-wrap;background:#f7f8fc;border-radius:9px;padding:13px;min-height:60px}.item{border:1px solid #e1e6ef;border-radius:9px;padding:10px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f6f7fb;border-radius:9px;padding:12px}.stat b{display:block;font-size:24px}@media(max-width:580px){.grid{grid-template-columns:1fr}.wrap{margin:18px auto}.stats{grid-template-columns:1fr 1fr}}footer{text-align:center;color:#68748a;font-size:12px;padding:20px}</style><main class="wrap"><div class="tag">COMPLETE JOB SEARCH EXECUTION SYSTEM · MODULE 01</div><h1>Weekly & Daily Job Search Planner</h1><p class="muted">Set weekly targets and follow a practical 30-minute daily routine.</p><section class="card"><h2>Set weekly targets</h2><div class="grid"><div><label>Application target</label><input id="apps" type="number" min="0" value="5"></div><div><label>Company research target</label><input id="companies" type="number" min="0" value="3"></div><div><label>Follow-up target</label><input id="follows" type="number" min="0" value="2"></div><div><label>Main focus</label><input id="focus" placeholder="e.g. Target junior analyst roles"></div></div><button onclick="makePlan()">Create weekly plan</button><button class="alt" onclick="downloadPlan()">Download plan</button><div id="plan" class="out" style="margin-top:12px">Your weekly plan appears here.</div></section><section class="card"><h2>30-minute daily routine</h2><label class="item"><input type="checkbox" class="task"> 5 min — Review saved opportunities and today's priority</label><label class="item"><input type="checkbox" class="task"> 10 min — Find and assess relevant openings</label><label class="item"><input type="checkbox" class="task"> 10 min — Tailor one application task</label><label class="item"><input type="checkbox" class="task"> 5 min — Update tracker and choose next action</label><p id="progress" class="muted">0 of 4 completed</p><button class="alt" onclick="resetDay()">Reset daily checklist</button></section><footer>Module 01 · Job Search Strategy</footer></main><script>let planText='';function makePlan(){let a=+document.getElementById('apps').value,b=+document.getElementById('companies').value,c=+document.getElementById('follows').value;if([a,b,c].some(x=>!Number.isInteger(x)||x<0)){alert('Enter non-negative whole-number targets.');return}planText=`WEEKLY JOB SEARCH PLAN\nApplication target: ${a}\nCompany research target: ${b}\nFollow-up target: ${c}\nMain focus: ${document.getElementById('focus').value||'Consistent targeted search'}\n\nMONDAY: Review target roles and shortlist suitable vacancies.\nTUESDAY: Research employers and prepare tailored applications.\nWEDNESDAY: Submit applications and update tracker.\nTHURSDAY: Continue applications and send follow-ups that are due.\nFRIDAY: Review activity, responses and next steps.\nWEEKEND: Reflect and prepare next week's priorities.\n\nDAILY 30-MINUTE ROUTINE\n5 min: Review saved opportunities.\n10 min: Find and assess relevant openings.\n10 min: Complete one tailored application task.\n5 min: Update tracker and choose next action.`;document.getElementById('plan').textContent=planText}function progress(){let n=[...document.querySelectorAll('.task')].filter(x=>x.checked).length;document.getElementById('progress').textContent=`${n} of 4 completed · ${n*25}%`}document.querySelectorAll('.task').forEach(x=>x.addEventListener('change',progress));function resetDay(){document.querySelectorAll('.task').forEach(x=>x.checked=false);progress()}function downloadPlan(){if(!planText){alert('Create your plan first.');return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([planText],{type:'text/plain'}));a.download='weekly-daily-planner.txt';a.click();URL.revokeObjectURL(a.href)}</script></html>
